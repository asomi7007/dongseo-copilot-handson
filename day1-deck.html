<title>DONGSEO_HANDSON · 동서석유화학</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#070b14; --surface:#0f1626; --surface-2:#16203a; --accent:#4da3ff; --text:#f8fafc; --sub:#cbd5e1; --muted:#94a3b8; --border:rgba(255,255,255,.09); --strong:rgba(77,163,255,.38); --rose:#fb7185; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:1.5rem; background-color:var(--bg);
    background-image:linear-gradient(to right,rgba(77,163,255,.045) 1px,transparent 1px),linear-gradient(to bottom,rgba(77,163,255,.045) 1px,transparent 1px);
    background-size:40px 40px; color:var(--text); font-family:'Pretendard Variable','Pretendard',system-ui,'Malgun Gothic',sans-serif; }
  .gate { width:min(440px,100%); background:var(--surface); border:1px solid var(--strong); border-radius:18px; padding:2rem; box-shadow:0 20px 50px rgba(0,0,0,.55); }
  .brand { font-weight:900; letter-spacing:.04em; font-size:1.05rem; }
  .brand span { color:var(--accent); }
  .tag { display:inline-block; margin-top:.6rem; font-size:.74rem; font-weight:700; color:var(--accent); background:rgba(77,163,255,.14); border:1px solid var(--strong); border-radius:4px; padding:.15rem .5rem; }
  h1 { font-size:1.45rem; line-height:1.35; margin:1.2rem 0 .5rem; }
  p { color:var(--sub); font-size:.92rem; line-height:1.7; }
  .bar { display:flex; gap:4px; margin:1.2rem 0; }
  .bar i { flex:1; height:6px; border-radius:99px; }
  form { display:grid; gap:.7rem; margin-top:1.2rem; }
  label { font-size:.82rem; color:var(--muted); font-weight:700; }
  input { width:100%; padding:.8rem .9rem; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:1rem; font-family:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { padding:.8rem; border-radius:10px; border:0; background:var(--accent); color:#04101f; font-weight:800; font-size:1rem; cursor:pointer; font-family:inherit; }
  button[disabled] { opacity:.6; cursor:wait; }
  .msg { min-height:1.3rem; font-size:.85rem; color:var(--rose); }
  .fine { margin-top:1rem; font-size:.78rem; color:var(--muted); }
</style>
</head>

<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent);
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, base, 256);
    return new Uint8Array(bits);
  }
  async function openWith(raw) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c));
    var page = new TextDecoder().decode(pt);
    try { sessionStorage.setItem('wbKey', toB64(raw)); } catch (e) {}
    // 문서 읽기가 끝나기 전에 document.open()을 부르면 무시되어 비밀번호 화면 뒤에 본문이 덧붙습니다.
    // 저장된 키로 바로 열 때(복호화가 매우 빠름) 이 경우가 생기므로, 읽기가 끝날 때까지 기다립니다.
    if (document.readyState === 'loading') { await new Promise(function (r) { document.addEventListener('DOMContentLoaded', r, { once: true }); }); }
    document.open(); document.write(page); document.close();
  }
  var saved = null;
  try { saved = sessionStorage.getItem('wbKey'); } catch (e) {}
  if (saved) { openWith(b64(saved)).catch(function () { try { sessionStorage.removeItem('wbKey'); } catch (e) {} }); }
  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), msg = document.getElementById('msg');
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'https 주소로 접속해야 열 수 있습니다.'; return; }
    btn.disabled = true; btn.textContent = '확인 중…'; msg.textContent = '';
    try { await openWith(await derive(document.getElementById('pw').value)); }
    catch (err) { msg.textContent = '비밀번호가 맞지 않습니다.'; btn.disabled = false; btn.textContent = '입장하기'; }
  });
})();
</script>
